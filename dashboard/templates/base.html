<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RegWatch{% endblock %}</title>
  <link rel="stylesheet" href="/static/simple.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>

<header class="masthead">
  <div class="shell masthead-in">
    <a class="logo" href="/">Reg<span>Watch</span></a>
    <nav class="top-nav" aria-label="Pages">
      <a href="/" aria-current="{{ 'page' if active == 'overview' else 'false' }}">Overview</a>
      <a href="/documents" aria-current="{{ 'page' if active == 'documents' else 'false' }}">Documents</a>
      <a href="/changes" aria-current="{{ 'page' if active == 'changes' else 'false' }}">Changes</a>
      <a href="/compliance" aria-current="{{ 'page' if active == 'compliance' else 'false' }}">Compliance</a>
    </nav>
  </div>
</header>

<main class="shell" id="content">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="shell footer-in">
    <span>Read-only · live Supabase data</span>
    <span>Times in IST · rendered {{ rendered_at|dt }}</span>
  </div>
</footer>
</body>
</html>
